name: API bug
description: An Alpaca API endpoint or stream returns wrong data, errors, or behaves unexpectedly.
labels: ["type: api bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs in the Alpaca API itself. For SDK bugs, feature requests, account help, or outages, go back and pick one of the links instead. Not sure which form fits? Pick the closest one.

        > [!WARNING]
        > This repository is public. **Never include API keys, secrets, OAuth tokens, or account numbers.** Replace them with placeholders such as `<API_KEY>` before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Trading API
        - Market Data API
        - Broker API
        - Authentication
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Paper / Sandbox
        - Live / Production
    validations:
      required: true
  - type: input
    id: request-url
    attributes:
      label: Method and full URL
      description: Include the full host, not just the path. The host tells us which region you are calling.
      placeholder: GET https://paper-api.alpaca.markets/v2/orders or wss://stream.data.alpaca.markets/v2/sip
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Query parameters, request body, or stream subscription message you sent, with credentials removed.
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The HTTP status code and response body you received, or the stream messages for WebSocket and SSE connections.
      render: shell
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: X-Request-ID
      description: The value of the `X-Request-ID` response header. Include it for REST calls whenever it is present.
  - type: input
    id: occurred-at
    attributes:
      label: When did it happen?
      description: An approximate date and time, including your timezone.
      placeholder: 2026-10-14 09:30 America/New_York
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: SDK name and version
      description: Leave blank if you called the API directly.
      placeholder: alpaca-py 0.40.0
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps us reproduce the problem.
  - type: checkboxes
    id: sanitized
    attributes:
      label: Sensitive data
      options:
        - label: I removed all API keys, secrets, tokens, and account numbers from this report.
          required: true
